<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Foundations - Daily Assignments</title>
    <style>
      :root {
        color: #17212b;
        background: #f4f7f5;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        max-width: 760px;
        margin: 0 auto;
        padding: 64px 24px;
      }

      h1 {
        margin-bottom: 8px;
      }

      p {
        color: #657381;
      }

      nav {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
        margin-top: 32px;
      }

      a {
        padding: 22px;
        border: 1px solid #d8e2dd;
        border-radius: 12px;
        background: white;
        color: #b84d35;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 10px 24px rgba(23, 33, 43, 0.08);
      }

      a:hover,
      a:focus-visible {
        background: #17212b;
        color: white;
      }

      @media (max-width: 600px) {
        body {
          padding: 40px 18px;
        }

        nav {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Web Foundations</h1>
      <p>Daily QuickNotes assignments</p>
      <nav aria-label="Assignment pages">
        <a href="day1/index.html">Day 1 Home</a>
        <a href="day1/about.html">Day 1 About</a>
        <a href="day2/index.html">Day 2 Home</a>
        <a href="day2/about.html">Day 2 About</a>
      </nav>
    </main>
  </body>
</html>
