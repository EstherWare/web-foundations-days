<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users Directory</title>
    <script src="users.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Users Directory</h1>

      <button id="load-users" type="button">Load users</button>

      <label for="filter-input">Filter users by name</label>
      <input
        id="filter-input"
        name="filter"
        type="search"
        placeholder="Type a name"
      />

      <p id="status" role="status" aria-live="polite"></p>
      <ul id="users-list"></ul>
    </main>
  </body>
</html>
